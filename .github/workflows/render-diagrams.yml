name: Render PlantUML Diagrams

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "stockia-c4-model-design/**/*.puml"
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output folders
        run: |
          mkdir -p src/images/context-diagram
          mkdir -p src/images/container-diagram
          mkdir -p src/images/component-diagram

      - name: Render existing diagrams (skip empty folders)
        run: |
          set -e
          shopt -s nullglob

          declare -A FOLDER_MAP=(
            ["ContextDiagram"]="context-diagram"
            ["ContainerDiagram"]="container-diagram"
            ["ComponentDiagram"]="component-diagram"
          )

          for src_name in "${!FOLDER_MAP[@]}"; do
            dest_name="${FOLDER_MAP[$src_name]}"
            src_dir="stockia-c4-model-design/${src_name}"
            dest_dir="src/images/${dest_name}"

            files=("${src_dir}"/*.puml)

            if [ ${#files[@]} -eq 0 ]; then
              echo "No .puml files found in ${src_dir}, skipping."
              continue
            fi

            echo "Rendering ${#files[@]} file(s) from ${src_dir} -> ${dest_dir}"

            docker run --rm \
              -v "${PWD}":/workspace \
              -w /workspace \
              plantuml/plantuml:latest \
              -tsvg -o "../${dest_dir}" "${files[@]}"

            docker run --rm \
              -v "${PWD}":/workspace \
              -w /workspace \
              plantuml/plantuml:latest \
              -tpng -o "../${dest_dir}" "${files[@]}"
          done

      - name: Commit rendered images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate diagram images from .puml sources"
          file_pattern: "src/images/**"
          add_options: "-f"